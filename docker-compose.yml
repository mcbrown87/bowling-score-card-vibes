version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: bowling-scorecard/Dockerfile
      target: dev
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    depends_on:
      app-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      storage-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      ML_SERVICE_URL: http://ml-service:8000
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://rustfs:9000
    volumes:
      - ./bowling-scorecard:/app
      - /app/node_modules
    env_file:
      - ./bowling-scorecard/.env
  app-migrate:
    build:
      context: .
      dockerfile: bowling-scorecard/Dockerfile
      target: dev
    command: >
      sh -c "npx prisma migrate deploy &&
             npx prisma generate"
    depends_on:
      db:
        condition: service_healthy
      storage-setup:
        condition: service_completed_successfully
    volumes:
      - ./bowling-scorecard:/app
      - /app/node_modules
    env_file:
      - ./bowling-scorecard/.env
    restart: 'no'
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bowling_scorecard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 5
  rustfs:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - rustfs-data:/data
  storage-setup:
    build:
      context: .
      dockerfile: bowling-scorecard/Dockerfile
      target: dev
    command: node scripts/ensure-storage-bucket.cjs
    depends_on:
      rustfs:
        condition: service_started
    environment:
      STORAGE_ENDPOINT: http://rustfs:9000
      STORAGE_BUCKET: ${STORAGE_BUCKET:-bowling-scorecards}
      STORAGE_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      STORAGE_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_USE_SSL: 'false'
    volumes:
      - ./bowling-scorecard:/app
      - /app/node_modules
    restart: 'no'
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      db:
        condition: service_healthy
  queue-worker:
    build:
      context: .
      dockerfile: bowling-scorecard/Dockerfile
      target: dev
    command: npm run queue:worker
    depends_on:
      app-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      storage-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      ML_SERVICE_URL: http://ml-service:8000
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://rustfs:9000
    env_file:
      - ./bowling-scorecard/.env
    volumes:
      - ./bowling-scorecard:/app
      - /app/node_modules
    restart: unless-stopped
  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
      args:
        INSTALL_DONUT_DEPS: ${INSTALL_DONUT_DEPS:-false}
    environment:
      MODEL_STORAGE_DIR: /app/data/models
    ports:
      - '8000:8000'
    volumes:
      - ./ml-service:/app
      - ml-model-data:/app/data
    restart: unless-stopped

volumes:
  postgres-data:
  rustfs-data:
  redis-data:
  ml-model-data:
